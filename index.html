<!DOCTYPE html>
<html>
<head>
  <title>Harga Emas Hari Ini</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 40px;
      background: linear-gradient(to bottom, #111, #222);
color: white;
    }
    .card {
      background: #1c1c1c;
      padding: 30px;
      border-radius: 15px;
      border: 1px solid gold;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: auto;
    }
    h1 { color: #b68d2c; }
    .price {
  font-size: 42px;
  margin-top: 25px;
  font-weight: bold;
  color: gold;
}
  </style>
</head>

<body>
  <div class="card">
    <h1>HARGA EMAS HARI INI</h1>

<p style="font-size:14px;color:#bbb; line-height:1.7;">
Harga yang ditampilkan merupakan estimasi harga emas murni 24K (99,99%).<br><br>

Untuk emas dengan kadar di bawah 24K, seperti 23K, 22K, atau kadar lainnya, 
nilai akan disesuaikan secara proporsional berdasarkan persentase kandungan emas.
</p>
    <div class="price" id="harga">Loading...</div>

    <div style="margin-top:30px;">

  <input
    type="number"
    id="kadar"
    placeholder="Masukkan kadar emas (%)"
    value="99.99"
    style="
      padding:12px;
      border-radius:10px;
      border:none;
      width:80%;
      text-align:center;
      font-size:16px;
    "
  >

  <br><br>

  <button
    onclick="hitungKadar()"
    style="
      padding:12px 20px;
      border:none;
      border-radius:10px;
      background:gold;
      font-weight:bold;
      cursor:pointer;
    "
  >
    Hitung Harga
  </button>

</div>
<p id="jam" style="margin-top:20px;color:#aaa;font-size:14px;">
Memuat waktu...
</p>
  </div>

<script>
async function ambilHargaEmas() {
  try {

    // ambil harga emas dunia
    const goldRes = await fetch("https://api.gold-api.com/price/XAU");
    const goldData = await goldRes.json();

    // ambil kurs realtime
    const kursRes = await fetch("https://open.er-api.com/v6/latest/USD");
    const kursData = await kursRes.json();

    let hargaOzUSD = goldData.price;
    let kurs = kursData.rates.IDR;

    // convert ke gram
    let hargaGram = (hargaOzUSD * kurs) / 31.1035;

    // kalibrasi supaya sama seperti goldprice.org
    hargaGram = hargaGram * 0.994;

    // potong 12%
    let hargaToko = hargaGram * 0.88;

    hargaToko = Math.round(hargaToko);

    document.getElementById("harga").innerHTML =
      "Rp " + hargaToko.toLocaleString("id-ID") + " / gram";

  } catch (error) {

    document.getElementById("harga").innerHTML =
      "Gagal mengambil harga emas";

  }
}

ambilHargaEmas();

  function updateJam() {
  const now = new Date();

  const waktu = now.toLocaleTimeString("id-ID");

  document.getElementById("jam").innerHTML =
    "Update: " + waktu;
}

updateJam();

setInterval(updateJam, 1000);
</script>
