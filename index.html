<!DOCTYPE html>
<html>
<head>
  <title>Harga Emas Hari Ini</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 40px;
      background: #f5f5f5;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: auto;
    }
    h1 { color: #b68d2c; }
    .price { font-size: 28px; margin-top: 20px; }
  </style>
</head>

<body>
  <div class="card">
    <h1>Harga Beli Toko Hari Ini</h1>
    <div class="price" id="harga">Loading...</div>
  </div>

  <script>
async function ambilHargaEmas() {
  const url = "https://api.metals.live/v1/spot/gold";

  const response = await fetch(url);
  const data = await response.json();

  let hargaPerOzUSD = data[0].price;

  // kurs rupiah sementara
  let kurs = 16000;

  // oz ke gram
  let hargaPerGramIDR = (hargaPerOzUSD / 31.1035) * kurs;

  // potong 12% harga beli toko
  let hargaToko = hargaPerGramIDR * 0.88;

  hargaToko = Math.round(hargaToko);

  document.getElementById("harga").innerHTML =
    "Rp " + hargaToko.toLocaleString("id-ID") + " / gram";
}

ambilHargaEmas();
  </script>
</body>
</html>
