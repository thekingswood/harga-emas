<!DOCTYPE html>
<html>
<head>
  <title>Harga Emas Hari Ini</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 40px;
      background: #f5f5f5;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: auto;
    }
    h1 { color: #b68d2c; }
    .price { font-size: 28px; margin-top: 20px; }
  </style>
</head>

<body>
  <div class="card">
    <h1>Harga Beli Toko Hari Ini</h1>
    <div class="price" id="harga">Loading...</div>
  </div>

<script>
async function ambilHargaEmas() {
  try {
    // ambil harga emas IDR per troy ounce dari goldprice.live (goldprice.org)
    const response = await fetch("https://api.goldprice.live/v1/spot/XAU/IDR");
    const data = await response.json();

    // harga emas IDR per oz
    let hargaPerOzIDR = data.price;

    // oz ke gram
    let hargaPerGram = hargaPerOzIDR / 31.1035;

    // potong 12% harga beli toko
    let hargaToko = hargaPerGram * 0.88;

    hargaToko = Math.round(hargaToko);

    document.getElementById("harga").innerHTML =
      "Rp " + hargaToko.toLocaleString("id-ID") + " / gram";

  } catch (error) {
    document.getElementById("harga").innerHTML =
      "Gagal ambil harga emas ❌";
  }
}

ambilHargaEmas();
</script>
